name: Release

# 打 tag（如 v0.1.0）推送到 main 时，自动构建 Windows / macOS / Linux 安装包并发布 GitHub Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # tauri-action 不会自动安装前端依赖，必须显式安装（含 @tauri-apps/cli），
      # 否则 `npm run tauri build` 会报 `tauri: command not found`。
      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Linux 需要 webkit2gtk 等系统依赖才能编译 Tauri。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxkbcommon-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # tauri-action 自动识别 Tauri 2，执行 `tauri build`，并把产物上传到该 tag 对应的 Release。
      - name: Build and publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Into ${{ github.ref_name }}"
          releaseBody: "自动构建的 Into 安装包：Windows（msi / nsis）、macOS（dmg / app）、Linux（deb / AppImage）。"
          releaseDraft: true
          prerelease: false

      # 说明：
      # - 各平台产物均为未签名版本：Windows/macOS 安装时系统可能提示，属正常。
      #   如需签名，可配置仓库 Secrets（Windows: TAURI_ACTION_WINDOWS_CERTIFICATE /
      #   TAURI_ACTION_WINDOWS_CERTIFICATE_PASSWORD；macOS: APPLE_CERTIFICATE / APPLE_ID 等）
      #   后由 tauri-action 自动签名（含 notarize）。
      # - macOS 产物架构取决于对应 runner（默认 x64 / arm64 之一）；如需 universal 需额外配置。
