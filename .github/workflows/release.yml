name: Release

# 打 tag（如 v0.1.0）推送到 main 时，自动构建 Windows / macOS / Linux 安装包并发布 GitHub Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 发布前先跑前后端测试；任一失败则整个 release 流水线
  # （含创建 draft、跨平台构建安装包）都不会继续。
  # 注：release.yml 仅在打 v* tag 时触发，而 test.yml 只对分支 push 生效，
  # 因此 tag 发布时的测试闸门必须放在这里才能真正拦住发布。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # cargo test 编译 Tauri 时同样需要 webkit 等系统库。
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxkbcommon-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Frontend typecheck & build
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  # 先单独创建一次 draft release，避免矩阵里每个平台各自创建、导致出现多个同名 release。
  create-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME
            // 幂等：先清掉同 tag 下已有的 draft release，避免重复触发时越攒越多
            // （已发布的 release 不会被删除）。
            const { data: releases } = await github.rest.repos.listReleases({
              ...context.repo,
              per_page: 100
            })
            for (const r of releases) {
              if (r.tag_name === tag && r.draft) {
                await github.rest.repos.deleteRelease({
                  ...context.repo,
                  release_id: r.id
                })
              }
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Into ${tag}`,
              body: "自动构建的 Into 安装包：Windows（msi / nsis）、macOS（dmg / app）、Linux（deb / AppImage）。",
              draft: true,
              prerelease: false
            })
            return data.id

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # tauri-action 不会自动安装前端依赖，必须显式安装（含 @tauri-apps/cli），
      # 否则 `npm run tauri build` 会报 `tauri: command not found`。
      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Linux 需要 webkit2gtk 等系统依赖才能编译 Tauri。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxkbcommon-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 通过 releaseId 把产物上传到上面统一创建的那个 release，而不是各自新建。
      - name: Build and publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

      # 说明：
      # - 各平台产物均为未签名版本：Windows/macOS 安装时系统可能提示，属正常。
      #   如需签名，可配置仓库 Secrets（Windows: TAURI_ACTION_WINDOWS_CERTIFICATE /
      #   TAURI_ACTION_WINDOWS_CERTIFICATE_PASSWORD；macOS: APPLE_CERTIFICATE / APPLE_ID 等）
      #   后由 tauri-action 自动签名（含 notarize）。
      # - macOS 产物架构取决于对应 runner（默认 x64 / arm64 之一）；如需 universal 需额外配置。
