name: Test

# 每次 push（任意分支）和 PR 都跑：前端类型检查/构建 + Rust 单元测试。
# 三大桌面平台（Windows / macOS / Linux）并行验证，尽早暴露平台相关问题。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # cargo test 编译 Tauri 时同样需要 webkit 等系统库（仅 Linux 需要）。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxkbcommon-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Frontend typecheck & build
        run: npm run build

      # 前端单元测试（vitest，含 src/*.test.tsx）。
      # 注意：npm run build 的 tsc 已排除测试文件，故单测需单独跑。
      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
